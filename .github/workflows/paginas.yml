name: Paginas

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paginas
  cancel-in-progress: true

jobs:
  publicar:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar a versão de produção
        run: npm run build

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
