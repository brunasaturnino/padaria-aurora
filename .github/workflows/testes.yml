name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes de unidade com cobertura
        run: npm run test:coverage

      - name: Instalar Chromium no Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Instalar Chromium no macOS e no Windows
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Rodar testes de ponta a ponta
        run: npm run test:e2e

      - name: Publicar cobertura no Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          use_oidc: true
